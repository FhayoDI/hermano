<VirtualHost *:80>
    ServerName stockfacil.com.br
    ServerAlias www.stockfacil.com.br
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/stockfacil-error.log
    CustomLog ${APACHE_LOG_DIR}/stockfacil-access.log combined
</VirtualHost>
